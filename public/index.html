<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мультиплеерный космос — Гравитационные манёвры</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        canvas {
            border: 2px solid #222;
            border-radius: 10px;
            cursor: crosshair;
        }

        #playerCount {
            position: fixed;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="900" height="650"></canvas>
    <div id="playerCount">Игроков: 1</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const playerCountEl = document.getElementById('playerCount');

        // ==================== ПОДКЛЮЧЕНИЕ К СЕРВЕРУ ====================
        const ws = new WebSocket(`ws://${window.location.host}`);
        
        // Игровые объекты
        const planets = [];
        const particles = [];
        const starField = [];
        const otherPlayers = new Map();
        let goal = { x: 2000, y: 1500, radius: 25 };
        let playerId = null;

        // Камера
        const camera = { x: 0, y: 0 };

        // Мой корабль
        const myShip = {
            x: 0,
            y: 0,
            vx: 0,
            vy: 0,
            angle: 0,
            fuel: 100,
            alive: true,
            trail: []
        };

        // Создание звёздного поля
        function createStarField() {
            const starCount = 3000;
            const spread = 5000;
            for (let i = 0; i < starCount; i++) {
                starField.push({
                    x: (Math.random() - 0.5) * spread * 2,
                    y: (Math.random() - 0.5) * spread * 2,
                    radius: Math.random() * 2.5 + 0.5,
                    opacity: Math.random() * 0.8 + 0.2,
                    twinkleSpeed: Math.random() * 0.02 + 0.01
                });
            }
        }

        // ==================== ОБРАБОТКА СООБЩЕНИЙ ====================
        ws.onopen = () => {
            console.log('Подключено к серверу');
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            switch (data.type) {
                case 'init':
                    playerId = data.playerId;
                    planets.push(...data.planets);
                    goal = data.goal;
                    
                    data.players.forEach(p => {
                        if (p.id !== playerId) {
                            otherPlayers.set(p.id, p);
                        } else {
                            myShip.x = p.x;
                            myShip.y = p.y;
                            myShip.color = p.color;
                            myShip.name = p.name;
                        }
                    });
                    break;
                    
                case 'state':
                    data.players.forEach(p => {
                        if (p.id === playerId) {
                            // Обновляем своё состояние с сервера
                            myShip.x = p.x;
                            myShip.y = p.y;
                            myShip.vx = p.vx;
                            myShip.vy = p.vy;
                            myShip.angle = p.angle;
                            myShip.fuel = p.fuel;
                            myShip.alive = p.alive;
                        } else {
                            otherPlayers.set(p.id, p);
                        }
                    });
                    break;
                    
                case 'playerJoined':
                    if (data.player.id !== playerId) {
                        otherPlayers.set(data.player.id, data.player);
                    }
                    break;
                    
                case 'playerLeft':
                    otherPlayers.delete(data.playerId);
                    break;
            }
            
            playerCountEl.textContent = `Игроков: ${otherPlayers.size + 1}`;
        };

        // ==================== ФИЗИКА ====================
        function applyGravity() {
            if (!myShip.alive) return;

            planets.forEach(planet => {
                const dx = planet.x - myShip.x;
                const dy = planet.y - myShip.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const minDist = planet.radius + 10;

                if (distance > minDist && distance < 800) {
                    const force = planet.mass / (distance * distance) * 0.15;
                    const angle = Math.atan2(dy, dx);
                    myShip.vx += Math.cos(angle) * force;
                    myShip.vy += Math.sin(angle) * force;
                } else if (distance < planet.radius) {
                    myShip.alive = false;
                    createExplosion(myShip.x, myShip.y);
                }
            });
        }

        function updateMyShip() {
            if (!myShip.alive) return;

            myShip.trail.push({ x: myShip.x, y: myShip.y });
            if (myShip.trail.length > 200) {
                myShip.trail.shift();
            }

            myShip.x += myShip.vx;
            myShip.y += myShip.vy;

            camera.x += (myShip.x - camera.x) * 0.08;
            camera.y += (myShip.y - camera.y) * 0.08;

            // Отправка состояния на сервер
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'update',
                    x: myShip.x,
                    y: myShip.y,
                    vx: myShip.vx,
                    vy: myShip.vy,
                    angle: myShip.angle,
                    fuel: myShip.fuel,
                    alive: myShip.alive
                }));
            }

            // Проверка достижения цели
            const distToGoal = Math.sqrt((goal.x - myShip.x) ** 2 + (goal.y - myShip.y) ** 2);
            if (distToGoal < goal.radius + 15) {
                myShip.alive = false;
                myShip.vx = 0;
                myShip.vy = 0;
                createSuccessExplosion(goal.x, goal.y);
            }
        }

        // ==================== УПРАВЛЕНИЕ ====================
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'r') {
                myShip.alive = true;
                myShip.trail = [];
                ws.send(JSON.stringify({ type: 'respawn' }));
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        function handleInput() {
            if (!myShip.alive) return;

            const thrust = 0.05;
            const rotationSpeed = 0.06;

            if (keys['arrowleft'] || keys['a']) {
                myShip.angle -= rotationSpeed;
            }
            if (keys['arrowright'] || keys['d']) {
                myShip.angle += rotationSpeed;
            }
            if (keys['arrowup'] || keys['w']) {
                if (myShip.fuel > 0) {
                    myShip.vx += Math.cos(myShip.angle) * thrust;
                    myShip.vy += Math.sin(myShip.angle) * thrust;
                    myShip.fuel -= 0.15;
                    createThrusterParticles();
                }
            }
            if (keys['arrowdown'] || keys['s']) {
                myShip.vx *= 0.995;
                myShip.vy *= 0.995;
            }

            const maxSpeed = 4;
            const currentSpeed = Math.sqrt(myShip.vx * myShip.vx + myShip.vy * myShip.vy);
            if (currentSpeed > maxSpeed) {
                myShip.vx = (myShip.vx / currentSpeed) * maxSpeed;
                myShip.vy = (myShip.vy / currentSpeed) * maxSpeed;
            }
        }

        // ==================== ЧАСТИЦЫ ====================
        function createThrusterParticles() {
            for (let i = 0; i < 3; i++) {
                particles.push({
                    x: myShip.x - Math.cos(myShip.angle) * 15,
                    y: myShip.y - Math.sin(myShip.angle) * 15,
                    vx: -Math.cos(myShip.angle) * 1 + (Math.random() - 0.5) * 0.5,
                    vy: -Math.sin(myShip.angle) * 1 + (Math.random() - 0.5) * 0.5,
                    life: 40,
                    maxLife: 40,
                    color: '#FF6F00',
                    radius: 3
                });
            }
        }

        function createExplosion(x, y) {
            for (let i = 0; i < 80; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 120, maxLife: 120,
                    color: '#FF5722',
                    radius: Math.random() * 4 + 2
                });
            }
        }

        function createSuccessExplosion(x, y) {
            for (let i = 0; i < 100; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                particles.push({
                    x: x, y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 100, maxLife: 100,
                    color: ['#4CAF50', '#FFD54F', '#2196F3', '#FF4081'][Math.floor(Math.random() * 4)],
                    radius: Math.random() * 5 + 2
                });
            }
        }

        function updateParticles() {
            particles.forEach((particle, index) => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vx *= 0.99;
                particle.vy *= 0.99;
                particle.life--;
                if (particle.life <= 0) {
                    particles.splice(index, 1);
                }
            });
        }

        // ==================== ОТРИСОВКА ====================
        function drawStarField() {
            const viewLeft = camera.x - canvas.width / 2 - 200;
            const viewRight = camera.x + canvas.width / 2 + 200;
            const viewTop = camera.y - canvas.height / 2 - 200;
            const viewBottom = camera.y + canvas.height / 2 + 200;

            starField.forEach(star => {
                if (star.x > viewLeft && star.x < viewRight && star.y > viewTop && star.y < viewBottom) {
                    const screenX = star.x - camera.x + canvas.width / 2;
                    const screenY = star.y - camera.y + canvas.height / 2;
                    const twinkle = Math.sin(Date.now() * star.twinkleSpeed) * 0.3 + 0.7;
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity * twinkle})`;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, star.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        function drawPlanets() {
            planets.forEach(planet => {
                const screenX = planet.x - camera.x + canvas.width / 2;
                const screenY = planet.y - camera.y + canvas.height / 2;

                if (screenX < -200 || screenX > canvas.width + 200 || screenY < -200 || screenY > canvas.height + 200) {
                    return;
                }

                const gradient = ctx.createRadialGradient(
                    screenX, screenY, planet.radius * 0.5,
                    screenX, screenY, planet.radius * 3
                );
                gradient.addColorStop(0, planet.glowColor + '33');
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.fillRect(screenX - planet.radius * 3, screenY - planet.radius * 3, planet.radius * 6, planet.radius * 6);

                const planetGradient = ctx.createRadialGradient(
                    screenX - planet.radius * 0.3, screenY - planet.radius * 0.3, planet.radius * 0.1,
                    screenX, screenY, planet.radius
                );
                planetGradient.addColorStop(0, planet.color);
                planetGradient.addColorStop(1, planet.glowColor);
                ctx.fillStyle = planetGradient;
                ctx.beginPath();
                ctx.arc(screenX, screenY, planet.radius, 0, Math.PI * 2);
                ctx.fill();

                if (planet.hasRing) {
                    ctx.strokeStyle = planet.color + '66';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.ellipse(screenX, screenY, planet.radius * 1.8, planet.radius * 0.4, -0.3, 0, Math.PI * 2);
                    ctx.stroke();
                }
            });
        }

        function drawGoal() {
            const screenX = goal.x - camera.x + canvas.width / 2;
            const screenY = goal.y - camera.y + canvas.height / 2;

            if (screenX > -50 && screenX < canvas.width + 50 && screenY > -50 && screenY < canvas.height + 50) {
                const pulse = Math.sin(Date.now() / 300) * 0.3 + 0.7;
                const gradient = ctx.createRadialGradient(screenX, screenY, 10, screenX, screenY, 60);
                gradient.addColorStop(0, `rgba(76, 175, 80, ${pulse})`);
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.fillRect(screenX - 60, screenY - 60, 120, 120);

                ctx.fillStyle = '#4CAF50';
                ctx.strokeStyle = '#388E3C';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(screenX, screenY, goal.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(screenX - 10, screenY);
                ctx.lineTo(screenX + 10, screenY);
                ctx.moveTo(screenX, screenY - 10);
                ctx.lineTo(screenX, screenY + 10);
                ctx.stroke();
            }
        }

        function drawGoalArrow() {
            const screenX = goal.x - camera.x + canvas.width / 2;
            const screenY = goal.y - camera.y + canvas.height / 2;
            const margin = 40;

            if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) {
                const dx = goal.x - myShip.x;
                const dy = goal.y - myShip.y;
                const angle = Math.atan2(dy, dx);
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;

                const scaleX = (canvas.width / 2 - margin) / Math.abs(Math.cos(angle));
                const scaleY = (canvas.height / 2 - margin) / Math.abs(Math.sin(angle));
                const scale = Math.min(scaleX, scaleY);
                const finalX = cx + Math.cos(angle) * scale;
                const finalY = cy + Math.sin(angle) * scale;

                const pulse = Math.sin(Date.now() / 200) * 5;

                ctx.save();
                ctx.translate(finalX, finalY);
                ctx.rotate(angle);

                const gradient = ctx.createRadialGradient(0, 0, 5, 0, 0, 30);
                gradient.addColorStop(0, 'rgba(76, 175, 80, 0.5)');
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.fillRect(-30, -30, 60, 60);

                ctx.fillStyle = '#4CAF50';
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(20 + pulse, 0);
                ctx.lineTo(-10, 10);
                ctx.lineTo(-5, 0);
                ctx.lineTo(-10, -10);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                const dist = Math.sqrt((goal.x - myShip.x) ** 2 + (goal.y - myShip.y) ** 2);
                ctx.fillStyle = '#4CAF50';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`${Math.round(dist)} м`, finalX, finalY + 30);
                ctx.textAlign = 'left';
            }
        }

        function drawShip(ship, isMyShip = false) {
            if (!ship.alive) return;

            const screenX = ship.x - camera.x + canvas.width / 2;
            const screenY = ship.y - camera.y + canvas.height / 2;

            if (isMyShip && ship.trail) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ship.trail.forEach((point, index) => {
                    const trailX = point.x - camera.x + canvas.width / 2;
                    const trailY = point.y - camera.y + canvas.height / 2;
                    if (index === 0) {
                        ctx.moveTo(trailX, trailY);
                    } else {
                        ctx.lineTo(trailX, trailY);
                    }
                });
                ctx.stroke();
            }

            ctx.save();
            ctx.translate(screenX, screenY);
            ctx.rotate(ship.angle || 0);

            const shipColor = ship.color || '#E0E0E0';
            ctx.fillStyle = shipColor;
            ctx.strokeStyle = isMyShip ? '#FFFFFF' : '#9E9E9E';
            ctx.lineWidth = isMyShip ? 3 : 2;
            ctx.beginPath();
            ctx.moveTo(15, 0);
            ctx.lineTo(-10, 10);
            ctx.lineTo(-5, 0);
            ctx.lineTo(-10, -10);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = isMyShip ? '#40C4FF' : '#FFD54F';
            ctx.strokeStyle = '#1565C0';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(5, 0, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.restore();

            // Имя игрока
            if (!isMyShip && ship.name) {
                ctx.fillStyle = 'white';
                ctx.font = '12px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(ship.name, screenX, screenY - 25);
                ctx.textAlign = 'left';
            }
        }

        function drawParticles() {
            particles.forEach(particle => {
                const screenX = particle.x - camera.x + canvas.width / 2;
                const screenY = particle.y - camera.y + canvas.height / 2;
                const opacity = particle.life / particle.maxLife;
                ctx.fillStyle = particle.color + Math.floor(opacity * 255).toString(16).padStart(2, '0');
                ctx.beginPath();
                ctx.arc(screenX, screenY, particle.radius * opacity, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        function drawUI() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.fillRect(20, 20, 150, 15);
            ctx.fillStyle = '#FF6F00';
            ctx.fillRect(20, 20, myShip.fuel * 1.5, 15);
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 2;
            ctx.strokeRect(20, 20, 150, 15);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 12px Arial';
            ctx.fillText('ТОПЛИВО', 25, 50);

            const speed = Math.sqrt(myShip.vx * myShip.vx + myShip.vy * myShip.vy);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 12px Arial';
            ctx.fillText(`СКОРОСТЬ: ${speed.toFixed(2)}`, 25, 70);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.font = '12px Arial';
            ctx.fillText(`X: ${Math.round(myShip.x)} | Y: ${Math.round(myShip.y)}`, 25, 90);

            if (!myShip.alive) {
                const distToGoal = Math.sqrt((goal.x - myShip.x) ** 2 + (goal.y - myShip.y) ** 2);
                if (distToGoal < goal.radius + 15) {
                    ctx.fillStyle = 'rgba(76, 175, 80, 0.9)';
                    ctx.font = 'bold 40px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('ЦЕЛЬ ДОСТИГНУТА!', canvas.width / 2, canvas.height / 2);
                    ctx.font = '20px Arial';
                    ctx.fillText('Нажмите R для перезапуска', canvas.width / 2, canvas.height / 2 + 40);
                    ctx.textAlign = 'left';
                } else {
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.8)';
                    ctx.font = 'bold 40px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('КОРАБЛЬ УНИЧТОЖЕН', canvas.width / 2, canvas.height / 2);
                    ctx.font = '20px Arial';
                    ctx.fillText('Нажмите R для перезапуска', canvas.width / 2, canvas.height / 2 + 40);
                    ctx.textAlign = 'left';
                }
            }

            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.font = '12px Arial';
            ctx.fillText('← → — поворот | ↑ — двигатель | ↓ — торможение | R — перезапуск', 20, canvas.height - 20);
        }

        // ==================== ИГРОВОЙ ЦИКЛ ====================
        function gameLoop() {
            ctx.fillStyle = '#0a0a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            handleInput();
            applyGravity();
            updateMyShip();
            updateParticles();

            drawStarField();
            drawParticles();
            drawPlanets();
            drawGoal();
            drawGoalArrow();
            
            // Отрисовка других игроков
            otherPlayers.forEach(player => {
                drawShip(player, false);
            });
            
            // Отрисовка своего корабля
            drawShip(myShip, true);
            
            drawUI();

            requestAnimationFrame(gameLoop);
        }

        // ==================== ЗАПУСК ====================
        createStarField();
        gameLoop();
    </script>
</body>
</html>
